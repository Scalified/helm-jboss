apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "jboss.fullname" $ }}
  labels: {{- include "jboss.labels" $ | nindent 4 }}
spec:
  {{- with .Values.jboss }}
  {{- $jboss := . }}
  replicas: {{ .replicaCount | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "jboss.selectorLabels" $ | nindent 6 }}
  template:
    metadata:
      {{- if .annotations }}
      annotations: {{- toYaml .annotations | nindent 8 }}
      {{- end }}
      labels: {{- include "jboss.selectorLabels" $ | nindent 8 }}
    spec:
      containers:
        {{- with .containers.jboss }}
        - name: {{ $.Chart.Name }}
          {{- with .image }}
          image: "{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ .pullPolicy | default "IfNotPresent" }}
          {{- end }}
          {{- if .env }}
          env: {{- toYaml .env | nindent 12 }}
          {{- end }}
          {{- if .ports }}
          ports: {{- toYaml .ports | nindent 12 }}
          {{- end }}
          {{- if .livenessProbe }}
          livenessProbe: {{- toYaml .livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .readinessProbe }}
          readinessProbe: {{- toYaml .readinessProbe | nindent 12 }}
          {{- end }}
          {{- if .resources }}
          resources: {{- toYaml .resources | nindent 12 }}
          {{- end }}
          {{- if .volumeMounts }}
          volumeMounts: {{- toYaml .volumeMounts | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- if .hostname }}
      hostname: {{ .hostname }}
      {{- end }}
      {{- if .imagePullSecrets }}
      imagePullSecrets: {{- toYaml .imagePullSecrets | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      {{- if .volumes }}
      volumes: {{- toYaml .volumes | nindent 8 }}
      {{- end }}
  {{- end }}
